#
# Compila Cruzer para Windows en un runner de GitHub.
#
# Por qué acá y no en el Mac del mantenedor: PyInstaller NO compila cruzado —
# un .exe de Windows sólo se puede construir en Windows. Este workflow usa un
# runner `windows-latest`, así que el repo produce el ejecutable solo.
#
# Cómo obtener el .exe:
#   - Cada push a main que toque desktop/ deja el .exe como *artifact* del run.
#   - Al publicar un tag `desktop-vX.Y` se crea además una **Release** con el
#     .exe adjunto, que es el link estable para mandarle al equipo.
#   - También se puede lanzar a mano desde la pestaña Actions (workflow_dispatch).

name: Build Windows

on:
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - ".github/workflows/build-windows.yml"
    tags: ["desktop-v*"]
  workflow_dispatch:

permissions:
  contents: write        # necesario para crear la Release

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"       # 3.11: la más estable con PyInstaller
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r desktop/requirements.txt
          pip install pyinstaller==6.11.1

      - name: Compilar el .exe
        working-directory: desktop/build
        run: pyinstaller --clean --noconfirm cruzer.spec

      - name: Verificar que el ejecutable arranca
        # No lo dejamos servir (abriría un navegador y quedaría colgado): sólo
        # comprobamos que el binario existe y no está corrupto.
        run: |
          $exe = "desktop/build/dist/Cruzer.exe"
          if (!(Test-Path $exe)) { throw "No se generó $exe" }
          $mb = [math]::Round((Get-Item $exe).Length / 1MB, 1)
          Write-Host "OK: Cruzer.exe generado ($mb MB)"
          if ($mb -lt 8) { throw "El .exe pesa $mb MB: sospechosamente chico" }

      - name: Publicar como artifact
        uses: actions/upload-artifact@v4
        with:
          name: Cruzer-Windows
          path: desktop/build/dist/Cruzer.exe
          retention-days: 30

      - name: Crear Release (sólo en tags desktop-v*)
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        uses: softprops/action-gh-release@v2
        with:
          files: desktop/build/dist/Cruzer.exe
          name: Cruzer ${{ github.ref_name }}
          body: |
            **Cruzer para Windows**

            Descarga `Cruzer.exe`, déjalo en el Escritorio y haz doble clic.

            - La primera vez instala el navegador (~150 MB), sólo una vez.
            - Se actualiza solo: baja el código desde GitHub en cada arranque.
            - Los Excel quedan en `Documentos\Cruzer`.

            Herramientas: MK7 · Sección · Fast (precios por mayor) · Ferni (SKU y Sección).
